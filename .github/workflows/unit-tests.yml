name: Unit test on push and PR


on: [push, pull_request, workflow_dispatch]


jobs:
  unit-tests:
    name: Run Unit Tests

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    env:
      OS: ${{ matrix.os }}
      PYTHON-VERSION: ${{ matrix.python-version }}

    runs-on: ${{ matrix.os }}

    steps:

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip

      - uses: actions/checkout@v4

      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest pytest-cov mock

      - run: python -m pytest ./tests/

  automated-tests:
    name: Test Automated tests
    
    runs-on: ubuntu-latest
    steps:
      - name: Start dispatch
        run: |
          curl -L   -X POST   -H "Accept: application/vnd.github+json"   -H "Authorization: Bearer ${{secrets.TEMP_TOKEN}}" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/MideTechnology/endaq-device-test/dispatches -d '{"event_type":"run-public-tests","client_payload":{"test1":"Remote Running!"}}'