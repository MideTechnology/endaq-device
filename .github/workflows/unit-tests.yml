name: Unit test on push and PR


on: [push, pull_request, workflow_dispatch]

  automated-tests:
    name: Test Automated tests
    
    runs-on: ubuntu-latest
    steps:
      - name: Start dispatch
        run: |
          curl -L   -X POST   -H "Accept: application/vnd.github+json"   -H "Authorization: Bearer ${{secrets.GITHUB_TOKEN}}" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/MideTechnology/endaq-device-test/dispatches -d '{"event_type":"run-public-tests","client_payload":{"test1":"Running with user permissions!"}}'