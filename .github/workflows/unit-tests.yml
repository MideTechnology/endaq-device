name: Unit test on push and PR


on: [push, pull_request, workflow_dispatch]


jobs:
  unit-tests:
    name: Run Unit Tests

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    env:
      OS: ${{ matrix.os }}
      PYTHON-VERSION: ${{ matrix.python-version }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip

      - uses: actions/checkout@v4

      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest pytest-cov mock

      - run: python -m pytest ./tests/

  automated-tests:
    name: Run Automated Device Tests

    env:
      APPROVED_USERS: '["eoneill-mide", "pscheidler", "StokesMIDE"]'

    runs-on: device-library-tester
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip

      - uses: actions/checkout@v4

      - name: Set up venv
        run: source testing_venv/bin/activate
        shell: bash

      - name: Set up libraries
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r ./test_hardware/requirements.txt
          python -m pip install pytest pytest-cov mock

      - name: Run device tests if pusher is approved
        if: ${{ contains(fromJSON(env.APPROVED_USERS), github.event.pusher.name) }}
        run: python -m pytest --random-order --device "S0654302" --raspi ./test_hardware/
        env:
          GUEST_WIFI_PW: ${{ secrets.GUEST_WIFI_PW }}

      - name: Print IP Address
        if: ${{ contains(fromJSON(env.APPROVED_USERS), github.event.pusher.name) }}
        run: |
          echo "IP=$(hostname -I | awk '{print $1}')"
        shell: bash
